title: "emopedia's plugins"
description: "View documentation for emopedia's plugins."

remote_theme: just-the-docs/just-the-docs@v0.12.0

search_enabled: true
heading_anchors: true
nav_sort: case_insensitive

color_scheme: dark

back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "GitHub":
    - "https://github.com/emopedia"

aux_links_new_tab: true

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red

collections_dir: plugins

collections:
  nurobots:
    output: true
    permalink: "/plugins/:collection/:path/"


just_the_docs:
  collections:
    nurobots:
      name: NuRobots
      nav_fold: true
